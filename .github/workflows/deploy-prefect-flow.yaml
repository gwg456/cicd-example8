name: Deploy Prefect Flow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'

jobs:
  # 代码质量检查
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linting
        run: |
          ruff check . --output-format=github

      - name: Run ruff formatting check
        run: |
          ruff format --check .

      - name: Run mypy type checking
        run: |
          mypy src/ --ignore-missing-imports

      - name: Run security scan with bandit
        run: |
          bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-scan-results
          path: bandit-report.json

  # 测试
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        test-type: [unit, integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ${{ matrix.test-type }} tests
        run: |
          pytest tests/${{ matrix.test-type }}/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.test-type == 'unit'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.test-type }}
          path: |
            coverage.xml
            htmlcov/

  # 安全扫描
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # 构建和部署
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [quality, test, security]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于版本标记

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pre-deployment tests
        run: |
          pytest tests/unit/ -v --tb=short
          python -c "from config import config; print('Config validation:', config.validate_required_settings())"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Generate version tag and image name
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=v$(date +'%Y%m%d%H%M')-manual" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          fi
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "ENVIRONMENT=${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:${{ steps.version.outputs.ENVIRONMENT }}
          labels: |
            org.opencontainers.image.title=Prefect CI/CD Example
            org.opencontainers.image.description=Automated workflow deployment with Prefect
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.BUILD_DATE }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: true
          sbom: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:${{ steps.version.outputs.VERSION }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Health check before deployment
        run: |
          echo "🔍 部署前健康检查..."

          # 测试Prefect API连接
          if curl -s --connect-timeout 10 --max-time 30 "${{ secrets.PREFECT_API_URL }}/health" > /dev/null; then
            echo "✅ Prefect API可访问"
          else
            echo "❌ Prefect API连接失败"
            echo "API URL: ${{ secrets.PREFECT_API_URL }}"
            exit 1
          fi

          # 验证镜像存在
          docker pull ${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:${{ steps.version.outputs.VERSION }}
          echo "✅ Docker镜像验证成功"

      - name: Deploy Prefect flows
        id: deploy
        run: |
          echo "🚀 开始部署Prefect流..."
          echo "📋 部署配置:"
          echo "  - Environment: ${{ steps.version.outputs.ENVIRONMENT }}"
          echo "  - Prefect API URL: ${{ secrets.PREFECT_API_URL }}"
          echo "  - 镜像: ${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:${{ steps.version.outputs.VERSION }}"
          echo "  - 工作池: my-docker-pool2"
          echo "  - 部署时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # 设置部署环境变量
          DEPLOY_ENV_VARS=(
            -e PREFECT_API_URL="${{ secrets.PREFECT_API_URL }}"
            -e IMAGE_REPO="${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}"
            -e IMAGE_TAG="${{ steps.version.outputs.VERSION }}"
            -e WORK_POOL_NAME="my-docker-pool2"
            -e DEPLOY_MODE=true
            -e ENVIRONMENT="${{ steps.version.outputs.ENVIRONMENT }}"
            -e LOG_LEVEL=INFO
            -e API_TIMEOUT=60
            -e DEPLOYMENT_TIMEOUT=300
            -e PYTHONUNBUFFERED=1
          )

          # 运行部署容器
          echo "🐳 启动部署容器..."
          set +e  # 允许命令失败

          timeout 600 docker run --rm \
            --network host \
            -v /etc/hosts:/etc/hosts:ro \
            "${DEPLOY_ENV_VARS[@]}" \
            ${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:${{ steps.version.outputs.VERSION }}

          DEPLOY_EXIT_CODE=$?
          set -e  # 重新启用错误检查

          # 分析部署结果
          if [ $DEPLOY_EXIT_CODE -eq 0 ]; then
            echo "✅ 部署成功完成！"
            echo "deployment_status=success" >> $GITHUB_OUTPUT
          elif [ $DEPLOY_EXIT_CODE -eq 124 ]; then
            echo "⏰ 部署超时（10分钟）"
            echo "deployment_status=timeout" >> $GITHUB_OUTPUT
          else
            echo "❌ 部署失败（退出码: $DEPLOY_EXIT_CODE）"
            echo "deployment_status=failed" >> $GITHUB_OUTPUT
          fi

          echo "deployment_exit_code=$DEPLOY_EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Post-deployment verification
        if: steps.deploy.outputs.deployment_status == 'success'
        run: |
          echo "🔍 部署后验证..."

          # 等待部署生效
          sleep 30

          # 这里可以添加部署验证逻辑
          # 例如：检查流程是否正确注册、健康检查等
          echo "✅ 部署验证完成"

      - name: Notify deployment status
        if: always()
        run: |
          STATUS="${{ steps.deploy.outputs.deployment_status }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          ENVIRONMENT="${{ steps.version.outputs.ENVIRONMENT }}"

          echo "📊 部署摘要:"
          echo "  - 状态: $STATUS"
          echo "  - 版本: $VERSION"
          echo "  - 环境: $ENVIRONMENT"
          echo "  - 时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          if [ "$STATUS" = "success" ]; then
            echo "🎉 部署成功完成！"
          elif [ "$STATUS" = "timeout" ]; then
            echo "⏰ 部署超时，请检查Prefect服务器状态"
          else
            echo "💥 部署失败，请查看日志了解详情"
          fi

      - name: Create deployment summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 Prefect CI/CD 部署报告

          ## 📋 部署信息
          - **环境**: ${{ steps.version.outputs.ENVIRONMENT }}
          - **版本**: ${{ steps.version.outputs.VERSION }}
          - **镜像**: \`${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:${{ steps.version.outputs.VERSION }}\`
          - **状态**: ${{ steps.deploy.outputs.deployment_status }}
          - **退出码**: ${{ steps.deploy.outputs.deployment_exit_code }}
          - **时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ## 🔗 相关链接
          - [Docker镜像](${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }})
          - [Prefect API](${{ secrets.PREFECT_API_URL }})
          - [工作流运行](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ## 📊 部署统计
          - **提交**: ${{ github.sha }}
          - **分支**: ${{ github.ref_name }}
          - **触发者**: ${{ github.actor }}
          - **事件**: ${{ github.event_name }}
          EOF