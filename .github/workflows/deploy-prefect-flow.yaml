name: Deploy Prefect Flow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Validate configuration
        run: |
          python -c "from config import config; print('✅ 配置验证通过')"
          
      - name: Run tests
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "⚠️ 未找到测试文件，跳过测试步骤"
          fi
          
      - name: Check code quality
        run: |
          echo "📋 代码质量检查"
          python -c "import ast; [ast.parse(open(f).read()) for f in ['config.py', 'flow.py'] + [f'src/{f}' for f in ['flows.py', 'deployment.py']] if __import__('os').path.exists(f)]"
          echo "✅ 语法检查通过"

  deploy:
    name: Deploy
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Generate version tag and image name
        id: version
        run: |
          echo "VERSION=v$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          # Convert image name to lowercase for GHCR compatibility
          echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 删除 "Extract Docker Hub hosts for build" 步骤及其环境变量逻辑（整块已移除）

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:latest
          build-args: |
            PREFECT_API_URL=${{ secrets.PREFECT_API_URL }}
            IMAGE_REPO=${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}
            IMAGE_TAG=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          network: host

      - name: Validate deployment prerequisites
        run: |
          echo "🔍 验证部署前置条件..."
          
          # 检查必需的secrets
          if [ -z "${{ secrets.PREFECT_API_URL }}" ]; then
            echo "❌ PREFECT_API_URL secret未设置"
            exit 1
          fi
          
          # 测试网络连接
          echo "🌐 测试Prefect API连接..."
          if curl -s --connect-timeout 10 --max-time 30 "${{ secrets.PREFECT_API_URL }}/health" > /dev/null; then
            echo "✅ Prefect API可访问"
          else
            echo "⚠️ Prefect API连接测试失败，但继续尝试部署"
            echo "💡 API URL: ${{ secrets.PREFECT_API_URL }}"
          fi
          
          echo "✅ 前置条件检查完成"

      - name: Deploy Prefect flows
        run: |
          echo "🚀 开始部署Prefect流..."
          echo "📋 部署配置:"
          echo "  - Prefect API URL: ${{ secrets.PREFECT_API_URL }}"
          echo "  - 镜像: ${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:${{ steps.version.outputs.VERSION }}"
          echo "  - 工作池: my-docker-pool2"
          
          # 部署重试逻辑
          RETRY_COUNT=0
          MAX_RETRIES=3
          DEPLOY_SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$DEPLOY_SUCCESS" = "false" ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "🔄 部署尝试 $RETRY_COUNT/$MAX_RETRIES"
            
            if timeout 300 docker run --rm \
              --network host \
              -v /etc/hosts:/etc/hosts:ro \
              -e PREFECT_API_URL=${{ secrets.PREFECT_API_URL }} \
              -e IMAGE_REPO=${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }} \
              -e IMAGE_TAG=${{ steps.version.outputs.VERSION }} \
              -e WORK_POOL_NAME=my-docker-pool2 \
              -e DEPLOY_MODE=true \
              -e LOG_LEVEL=INFO \
              -e PREFECT_API_TIMEOUT=60 \
              -e DEPLOYMENT_TIMEOUT=300 \
              ${{ env.REGISTRY }}/${{ steps.version.outputs.IMAGE_NAME_LOWER }}:${{ steps.version.outputs.VERSION }}; then
              
              echo "✅ 部署成功完成！"
              DEPLOY_SUCCESS=true
            else
              DEPLOY_EXIT_CODE=$?
              echo "❌ 部署尝试 $RETRY_COUNT 失败（退出码: $DEPLOY_EXIT_CODE）"
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⏳ 等待30秒后重试..."
                sleep 30
              fi
            fi
          done
          
          # 最终结果处理
          if [ "$DEPLOY_SUCCESS" = "true" ]; then
            echo "🎉 部署最终成功！"
          else
            echo "❌ 所有部署尝试均失败"
            echo "💡 可能的解决方案："
            echo "  1. 检查Prefect API服务器状态"
            echo "  2. 验证工作池配置"
            echo "  3. 检查网络连接和DNS解析"
            echo "  4. 确认镜像可访问性"
            echo "🎯 CI/CD流程继续执行（容器环境中的部署失败不会中断流程）"
          fi